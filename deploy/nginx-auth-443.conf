# Reverse-proxy для BurningHouse Auth (auth.burninghouse.ru).
#
# Установка (ТОЛЬКО ПОСЛЕ выпуска сертификата — иначе nginx -t упадёт на
# отсутствующем файле fullchain.pem и nginx не перезагрузится):
#   1) sudo certbot certonly --standalone -d auth.burninghouse.ru
#   2) sudo cp deploy/nginx-auth-443.conf /etc/nginx/sites-available/auth
#   3) sudo ln -s /etc/nginx/sites-available/auth /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx
#
# ПОЧЕМУ ЗДЕСЬ НЕТ БЛОКА listen 80 (хотя редирект http→https напрашивается):
# сертификаты на этом сервере выпускаются и продлеваются через certbot --standalone,
# а он на время проверки сам поднимает слушателя на порту 80. Стоит занять 80-й
# nginx-ом — и продление молча начнёт падать с «port 80 in use», причём не сейчас,
# а месяца через два, у ВСЕХ доменов сервера, включая money.burninghouse.ru.
# Потерять от этого нечего: на auth-домен пользователь приходит только редиректом
# с https-страницы сервиса, руками его адрес не набирают.
# Если однажды 80-й всё же понадобится — сначала переведите ВСЕ сертификаты на
# webroot-проверку и добавьте в 80-й блок location для /.well-known/acme-challenge/.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/auth.burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.burninghouse.ru/privkey.pem;

    client_max_body_size 1m;   # сюда ходят только формы входа и обмен токенов

    # Страница входа не должна открываться в чужом фрейме — иначе поле пароля
    # можно накрыть невидимым слоем (кликджекинг).
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # По этому заголовку сервис понимает, что снаружи https, и ставит куку Secure.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
