# Reverse-proxy для BurningHouse Auth (auth.burninghouse.ru).
#
# Установка:
#   1) sudo cp deploy/nginx-auth-443.conf /etc/nginx/sites-available/auth
#   2) sudo ln -s /etc/nginx/sites-available/auth /etc/nginx/sites-enabled/
#   3) sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат получается ДО первого включения этого файла:
#   sudo certbot certonly --standalone -d auth.burninghouse.ru
# (порт 80 на время выпуска должен быть свободен; A-запись домена уже должна
#  указывать на сервер, иначе certbot не пройдёт проверку)

server {
    listen 80;
    listen [::]:80;
    server_name auth.burninghouse.ru;
    # Только редирект на https: на auth-домене по http делать нечего —
    # кука сессии помечена Secure и по http всё равно не полетит.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/auth.burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.burninghouse.ru/privkey.pem;

    client_max_body_size 1m;   # сюда ходят только формы и обмен токенов

    # Страницы входа не должны попадать в чужие фреймы (кликджекинг на форме пароля).
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
