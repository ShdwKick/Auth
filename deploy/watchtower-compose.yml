# Watchtower — обновляет контейнеры BurningHouse сам, когда в Docker Hub появляется
# новый образ. Общая инфраструктура сервера: ставится ОДИН раз на всю машину, а не
# на каждый проект. Лежит в этом репозитории потому, что auth — общая часть для всех
# проектов; к самому auth-сервису Watchtower отношения не имеет.
#
# Зачем: чтобы в GitHub Actions не хранить SSH-ключ к серверу. CI только собирает и
# публикует образ, забирает его сервер сам. Новому проекту тогда не нужен ни один
# инфраструктурный секрет — хватает DOCKERHUB_TOKEN, который доступа к серверу не даёт.
#
# Установка:
#   mkdir -p ~/watchtower && cd ~/watchtower
#   # скопировать этот файл как docker-compose.yml
#   docker compose up -d
#   docker compose logs -f          # в логе должно быть "Only checking containers using enable label"
#
# ВАЖНО — обновляются только контейнеры с явной меткой. На этом сервере кроме
# приложений живут xray, WireGuard, zabbix и панель 3x-ui; самовольно обновлять их
# Watchtower не должен, поэтому режим строго opt-in. Чтобы проект попал под
# автообновление, в его compose нужна метка:
#
#   labels:
#     com.centurylinklabs.watchtower.enable: "true"

name: watchtower

services:
  watchtower:
    # Проект давно не обновлялся (1.7.1 — последний релиз), поэтому и нужен пин
    # DOCKER_API_VERSION ниже. Если однажды перестанет работать совсем — есть
    # поддерживаемые форки сообщества, но у контейнера доступ к docker.sock,
    # то есть фактически root на хосте: образ менять только осознанно.
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: unless-stopped
    environment:
      # Обновлять ТОЛЬКО помеченные контейнеры, остальные не трогать.
      WATCHTOWER_LABEL_ENABLE: "true"

      # Без этого Watchtower 1.7.1 НЕ СТАРТУЕТ на современном демоне: его встроенный
      # клиент представляется версией API 1.25, а Docker Engine отвечает
      # "client version 1.25 is too old".
      DOCKER_API_VERSION: "1.44"

      # Удалять старый образ после обновления — заменяет ручной docker image prune.
      WATCHTOWER_CLEANUP: "true"

      # Как часто спрашивать Docker Hub, не изменился ли образ, секунды.
      # 900 (15 минут) выбрано не наугад: каждая проверка считается обращением к
      # реестру, а у анонимных запросов Docker Hub есть лимит на IP. При 15 минутах
      # и трёх сервисах выходит ~72 обращения за 6 часов — с запасом. Если поставить
      # 60 секунд или довести список сервисов до десятка, лимит начнёт срабатывать
      # и обновления будут молча пропускаться: тогда либо увеличьте интервал, либо
      # авторизуйте Watchtower (см. ниже) — авторизованным лимит выше.
      WATCHTOWER_POLL_INTERVAL: "900"

      TZ: Europe/Moscow
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Авторизация в Docker Hub — нужна для приватных образов и поднимает лимит
      # на обращения к реестру. Сначала на сервере: docker login
      # - /root/.docker/config.json:/config.json:ro
