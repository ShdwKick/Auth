name: bh-auth

services:
  auth:
    image: shadowkick/auth:latest
    container_name: auth
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      # ОБЯЗАТЕЛЬНО и ровно тот адрес, по которому сервис доступен снаружи:
      # он подписывается внутрь токенов (claim iss), и сервисы сверяют его побайтово.
      ISSUER: https://auth.burninghouse.ru

      # Сервисы-потребители. Можно вместо этого завести их разово командой
      #   docker compose exec auth node server.js client-add finance "Мои финансы" https://money.burninghouse.ru/
      # SEED_CLIENTS подтягивается при каждом старте и удобен тем, что список
      # сервисов лежит рядом с конфигом, а не только в базе.
      SEED_CLIENTS: >-
        [{"client_id":"finance","name":"Мои финансы",
          "redirect_uris":["https://money.burninghouse.ru/"],
          "origins":["https://money.burninghouse.ru"]}]

      # Общий секрет для Admin: доступ к /internal/* (статистика, логи,
      # управление ролями) на этом сервисе и на Finance/Movies/Trip. Одно и то
      # же значение — во всех compose разом, иначе Admin получит 403.
      # Берётся из файла .env рядом с этим compose (права 600), сам секрет в
      # репозиторий не попадает — см. README-deploy.md. Сгенерировать:
      # openssl rand -hex 32. Пустым — /internal/* просто всегда отвечает 403,
      # а не падает, так что это безопасное значение по умолчанию.
      ADMIN_INTERNAL_KEY: ${ADMIN_INTERNAL_KEY:-}

      # Первый аккаунт при пустой базе (на существующую базу не влияет):
      # AUTH_USER: myname
      # AUTH_PASS: my-strong-password

      # Закрыть саморегистрацию:
      # REGISTER_CODE: замените-на-свой-секрет   # регистрация по коду приглашения
      # REGISTER_CLOSED: "1"                     # совсем закрыть, аккаунты только через CLI

      # Почта для сброса пароля (см. lib/mailer.js) — Resend, HTTP API. Без ключа
      # письма не уходят, только пишутся в лог контейнера (docker compose logs auth) —
      # так можно проверить саму ссылку, не настраивая почту заранее.
      # RESEND_API_KEY: re_ваш_ключ_с_resend.com
      # MAIL_FROM: "BurningHouse <noreply@burninghouse.ru>"   # адрес обязан быть на подтверждённом в Resend домене
    ports:
      # Только на localhost — наружу отдаёт nginx на 443 (см. README-deploy.md).
      - "127.0.0.1:8788:8788"
    volumes:
      - auth-data:/app/data

volumes:
  auth-data:
